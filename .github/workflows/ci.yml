name: Offline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, node: '22.x' }
          - { os: ubuntu-24.04, node: '24.x' }
          - { os: windows-2025, node: '24.x' }
          - { os: macos-15, node: '24.x' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false
      - name: Record runtime
        run: node --version && npm --version
      - name: Install lockfile dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate offline and qualify the npm tarball
        run: npm run validate:ci
      - name: Verify checks did not rewrite tracked files
        run: git diff --exit-code
      - name: Retain the qualified source artifact
        run: npm run release:prepare
      - name: Store immutable tarball and source evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}-${{ matrix.os }}-${{ matrix.node }}
          path: .cache/release/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          overwrite: false
  browsers:
    name: Browsers / Node ${{ matrix.node }} / ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false
      - name: Record runtime
        run: node --version && npm --version
      - run: npm ci --no-audit --no-fund
      - name: Configure bounded Ubuntu package downloads
        shell: bash
        run: |
          test -f /etc/apt/apt-mirrors.txt
          grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-circleso-network >/dev/null
          cat /etc/apt/apt-mirrors.txt
          apt-config dump | grep -E '^Acquire::(Retries|http::Timeout|https::Timeout) '
      - name: Install pinned browser builds and system libraries
        run: node node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - run: npm run build
      - name: Qualify actual tarball in Chromium Firefox and WebKit
        run: npm run test:browser
      - run: git diff --exit-code
