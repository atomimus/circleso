name: Offline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, node: '22.x' }
          - { os: ubuntu-24.04, node: '24.x' }
          - { os: windows-2025, node: '24.x' }
          - { os: macos-15, node: '24.x' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false
      - name: Record runtime
        run: node --version && npm --version
      - name: Install lockfile dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate offline
        run: npm run validate:ci
      - name: Verify checks did not rewrite tracked files
        run: git diff --exit-code
