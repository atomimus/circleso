                "$ref": "#/components/schemas/error"
  "/api/admin/v2/workflows/{id}/duplicate":
    post:
      summary: Duplicate a workflow
      tags:
      - Workflows
      description: |
        Duplicate (clone) an existing workflow. The copy is created in draft status and
        includes all of the original's triggers, actions and schedule configuration.
        No workflow run is triggered by the duplication. Returns the new workflow together
        with a URL to open it in Settings.
      security:
      - token_auth: []
        host: []
      parameters:
      - name: id
        in: path
        format: uuid
        required: true
        description: UUID of the workflow to duplicate
        schema:
          type: string
      responses:
        '201':
          description: Workflow duplicated successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/workflow"
        '404':
          description: Workflow in another community
          content:
            application/json:
              examples:
                not_found:
                  value:
                    success: false
                    message: Oops! Missing record. Please try again later.
                    error_details:
                      message: 'Missing record: workflow'
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: Refuses to duplicate a fork while branch authoring is off
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: Unauthenticated
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
  "/api/admin/v2/workflows":
    get:
      summary: List a community's automations/workflows
      tags:
      - Workflows
      security:
      - token_auth: []
        host: []
      description: |
        Lists the community's automations/workflows, newest first, paginated. Each record is a lean
        summary (id, name, status, type); it omits the trigger/actions graph and any URL - fetch a
        single workflow to get the full graph. Filters are optional and combine with AND.

        `status` semantics (note the omit-vs-all difference):
        - omit -> all workflows, INCLUDING archived
        - `all` -> all workflows EXCEPT archived
        - `archived` -> only archived workflows
        - `draft` / `active` / `inactive` -> only workflows with that status
      parameters:
      - name: query
        in: query
        required: false
        description: Filter by workflow name (substring match).
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Filter by status. Omit to include archived; use `all` to exclude
          archived; use `archived` for only archived.
        schema:
          type: string
          enum:
          - draft
          - active
          - inactive
          - archived
          - all
      - name: workflow_type
        in: query
        required: false
        description: 'Filter by type: dynamic (Automation), bulk_action (Bulk action),
          scheduled (Scheduled).'
        schema:
          type: string
          enum:
          - dynamic
          - bulk_action
          - scheduled
      - name: page
        in: query
        required: false
        description: Page number (min 1)
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Records per page (max 100)
        schema:
          type: integer
      responses:
        '200':
          description: Retrieves a paginated list of the community's workflows
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/workflows_list"
        '401':
          description: Unauthenticated
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
  "/api/admin/v2/workflows/{id}":
    get:
      summary: Get Workflow
      tags:
      - Workflows
      description: Gets a single workflow by its UUID, including its trigger and all
        action steps in execution order. Each action carries a 1-indexed `list_position`
        for placement decisions; the raw `position` can have gaps.
      security:
      - token_auth: []
        host: []
      parameters:
      - name: id
        in: path
        schema:
          type: string
          format: uuid
        required: true
        description: UUID of the workflow
      responses:
        '200':
          description: Returns the workflow with its trigger and ordered actions
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/workflow_detail"
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
