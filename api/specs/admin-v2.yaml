---
openapi: 3.0.1
info:
  title: Admin API V2
  version: v1
components:
  securitySchemes:
    token_auth:
      type: apiKey
      description: Authorization header in the format "Token AUTH_TOKEN"
      name: Authorization
      in: header
    host:
      type: apiKey
      name: host
      in: header
  schemas:
    FilterResponse:
      title: FilterResponse
      description: This is the root object
      type: object
      required:
      - filter_configurations
      properties:
        filter_configurations:
          type: array
          items:
            "$ref": "#/components/schemas/Configuration"
        enabled:
          type: boolean
          description: Whether member filtering is enabled for this surface
        base_search_params:
          "$ref": "#/components/schemas/BaseSearchParams"
    BaseSearchParams:
      title: BaseSearchParams
      description: Search params the client must send with every request for this
        surface
      type: object
      required:
      - status
      properties:
        exclude_empty_name:
          type: boolean
          description: Whether members without a name are excluded
        status:
          type: string
          description: Member status to scope the search to
        order:
          type: object
          additionalProperties: true
          description: Order clause, keyed by sortable field
        filters:
          type: array
          items:
            "$ref": "#/components/schemas/BaseSearchParamsFilter"
          description: Filters that are always applied on this surface
    BaseSearchParamsFilter:
      type: object
      required:
      - id
      - key
      - value
      properties:
        id:
          type: string
        key:
          type: string
        value:
          oneOf:
          - type: string
          - type: boolean
    Configuration:
      description: These are the allowed configurations
      oneOf:
      - "$ref": "#/components/schemas/StringFilterTypeConfiguration"
      - "$ref": "#/components/schemas/BooleanFilterTypeConfiguration"
      - "$ref": "#/components/schemas/RadioFilterTypeConfiguration"
      - "$ref": "#/components/schemas/ArrayFilterTypeConfiguration"
      - "$ref": "#/components/schemas/NearMeFilterTypeConfiguration"
      - "$ref": "#/components/schemas/PresetFilterTypeConfiguration"
      - "$ref": "#/components/schemas/LocationFilterTypeConfiguration"
      - "$ref": "#/components/schemas/SearchFilterTypeConfiguration"
      - "$ref": "#/components/schemas/NumberFilterTypeConfiguration"
      - "$ref": "#/components/schemas/AsyncSearchFilterTypeConfiguration"
      - "$ref": "#/components/schemas/DaysAgoFilterTypeConfiguration"
      - "$ref": "#/components/schemas/NumberRangeFilterTypeConfiguration"
      discriminator:
        propertyName: input_type
        mapping:
          string: "#/components/schemas/StringFilterTypeConfiguration"
          boolean: "#/components/schemas/BooleanFilterTypeConfiguration"
          radio: "#/components/schemas/RadioFilterTypeConfiguration"
          array: "#/components/schemas/ArrayFilterTypeConfiguration"
          near_me: "#/components/schemas/NearMeFilterTypeConfiguration"
          preset: "#/components/schemas/PresetFilterTypeConfiguration"
          location: "#/components/schemas/LocationFilterTypeConfiguration"
          search: "#/components/schemas/SearchFilterTypeConfiguration"
          number: "#/components/schemas/NumberFilterTypeConfiguration"
          async_search: "#/components/schemas/AsyncSearchFilterTypeConfiguration"
          days_ago: "#/components/schemas/DaysAgoFilterTypeConfiguration"
          number_range: "#/components/schemas/NumberRangeFilterTypeConfiguration"
    BaseFilterInputType:
      type: object
      required:
      - type
      - key
      - label
      - icon
      - allow_multiple
      - pinned
      - visible_by_default
      - filter_group
      properties:
        type:
          type: string
          enum:
          - standard
          - search
          description: Type of the filter
        key:
          type: string
          description: Unique identifier for the filter
        label:
          type: string
          description: Display label for the filter
        icon:
          type: string
          nullable: true
          description: Icon identifier for the filter
        allow_multiple:
          type: boolean
          description: Whether multiple selections are allowed
        pinned:
          type: boolean
          description: Whether the filter is pinned
        visible_by_default:
          type: boolean
          description: Whether the filter is visible by default
        customizable:
          type: boolean
          description: Whether admins can customize this filter
        filter_group:
          allOf:
          - "$ref": "#/components/schemas/FilterGroups"
          description: The group this filter belongs to. Filters are ordered by group
            first, then within a group by the admin's saved order
        enabled:
          type: boolean
          description: Whether the filter is currently enabled (customize contexts
            only)
        filter_kit_control:
          nullable: true
          allOf:
          - "$ref": "#/components/schemas/FilterKitControl"
          description: The persisted or default FilterKit::Control for this filter
            (customize contexts only)
    FilterKitControl:
      type: object
      required:
      - key
      - filter_type
      - enabled
      properties:
        id:
          type: integer
          nullable: true
        community_id:
          type: integer
          nullable: true
        space_id:
          type: integer
          nullable: true
        profile_field_id:
          type: integer
          nullable: true
        key:
          type: string
        filter_type:
          type: string
        enabled:
          type: boolean
        sort_key:
          type: integer
          nullable: true
        created_at:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true
        profile_field:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            key:
              type: string
            label:
              type: string
        space:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
    FilterGroups:
      type: string
      enum:
      - global
      - presets
      - profile
      description: 'Groups scope ordering — filters are only sorted relative to others
        in the same group. Returned in a fixed order: global, presets, profile'
    LocationSources:
      type: string
      enum:
      - mapbox_v6
      description: Available location data sources
    StringFilterTypes:
      type: string
      enum:
      - contains
      - does_not_contain
      - is
      - is_not
      - not_exist
      - exist
      description: Available string filter types
    NumberFilterTypes:
      type: string
      enum:
      - is
      - is_not
      description: Available number filter types
    NumberFilterTypeConfiguration:
      allOf:
      - "$ref": "#/components/schemas/BaseFilterInputType"
      - type: object
        required:
        - input_type
        - payload
        properties:
          input_type:
            type: string
            enum:
            - number
            description: Number input type identifier
          payload:
            type: object
            required:
            - filter_types
            properties:
              filter_types:
                type: array
                items:
                  "$ref": "#/components/schemas/NumberFilterTypes"
                description: Available filter types for number filters
              additional_params:
                type:
                - object
                - 'null'
                description: Additional parameters for the filter
              number_options:
                "$ref": "#/components/schemas/NumberFilterOptions"
    DaysAgoFilterTypes:
      type: string
      enum:
      - lt
      - eq
      - gt
      description: Available days ago filter types
    DaysAgoFilterTypeConfiguration:
      allOf:
      - "$ref": "#/components/schemas/BaseFilterInputType"
      - type: object
        required:
        - input_type
        - payload
        properties:
          input_type:
            type: string
            enum:
            - days_ago
            description: Days ago input type identifier
          payload:
            type: object
            required:
            - filter_types
            properties:
              filter_types:
                type: array
                items:
                  "$ref": "#/components/schemas/DaysAgoFilterTypes"
                description: Available filter types for days ago filters
    NumberRangeFilterTypes:
      type: string
      enum:
      - lt
      - gt
      - between
      description: Available number range filter types
    NumberRangeFilterTypeConfiguration:
      allOf:
      - "$ref": "#/components/schemas/BaseFilterInputType"
      - type: object
        required:
        - input_type
        - payload
        properties:
          input_type:
            type: string
            enum:
            - number_range
            description: Number range input type identifier
          payload:
            type: object
            required:
            - filter_types
            properties:
              filter_types:
                type: array
                items:
                  "$ref": "#/components/schemas/NumberRangeFilterTypes"
                description: Available filter types for number range filters
              min:
                type: number
                nullable: true
                description: Minimum value for the number range
              max:
                type: number
                nullable: true
                description: Maximum value for the number range
    NumberFilterOptions:
      type: object
      required:
      - id
      - format
      - decimal
      - position
      - text
      properties:
        id:
          type: integer
        format:
          type: string
          enum:
          - number
          - percentage
          - custom
          - unformatted
        decimal:
          type: integer
          nullable: true
        position:
          type: string
          enum:
          - left
          - right
          nullable: true
        text:
          type: string
          nullable: true
    StringFilterTypeConfiguration:
      allOf:
      - "$ref": "#/components/schemas/BaseFilterInputType"
      - type: object
        required:
        - input_type
        - payload
        properties:
          input_type:
            type: string
            enum:
            - string
            description: String input type identifier
          payload:
            type: object
            required:
            - filter_types
            properties:
              filter_types:
                type: array
                items:
                  "$ref": "#/components/schemas/StringFilterTypes"
                description: Available filter types for string filters
              additional_params:
                type:
                - object
                - 'null'
                description: Additional parameters for the filter
    BooleanFilterTypeConfiguration:
      allOf:
      - "$ref": "#/components/schemas/BaseFilterInputType"
      - type: object
        required:
        - input_type
        - payload
        properties:
          input_type:
            type: string
            enum:
            - boolean
            description: Boolean input type identifier
          payload:
            type: object
            nullable: true
            description: No payload required for boolean filters
    RadioOption:
      type: object
      required:
      - key
      - value
      properties:
        key:
          type: string
          description: Option key
        value:
          oneOf:
          - type: string
          - type: number
          description: Option value
    RadioFilterTypeConfiguration:
      allOf:
      - "$ref": "#/components/schemas/BaseFilterInputType"
      - type: object
        required:
        - input_type
        - payload
        properties:
          input_type:
            type: string
            enum:
            - radio
            description: Radio input type identifier
          payload:
            type: object
            required:
            - options
            properties:
              options:
                type: array
                items:
                  "$ref": "#/components/schemas/RadioOption"
                description: Available radio button options
    ArrayFilterTypes:
      type: string
      enum:
      - is
      - is_not
      - not_exist
      - exist
      description: Available array filter types
    ArrayOption:
      type: object
      required:
      - text
      - value
      properties:
        text:
          type: string
          description: Display text for the option
        value:
          oneOf:
          - type: string
          - type: number
          description: Option value
        group:
          type: string
          nullable: true
          description: The group the option should be shown in, can be null
    ArrayFilterTypeConfiguration:
      allOf:
      - "$ref": "#/components/schemas/BaseFilterInputType"
      - type: object
        required:
        - input_type
        - payload
        properties:
          input_type:
            type: string
            enum:
            - array
            description: Array input type identifier
          payload:
            type: object
            required:
            - options
            - filter_types
            - mode
            properties:
              options:
                type: array
                items:
                  "$ref": "#/components/schemas/ArrayOption"
                description: Available array options
              filter_types:
                type: array
                items:
                  "$ref": "#/components/schemas/ArrayFilterTypes"
                description: Available filter types for array filters
              mode:
                type: string
                enum:
                - inline
                - popover
                description: Mode of the array filter
              additional_params:
                type: object
                nullable: true
                additionalProperties: true
                description: Additional parameters (flexible object)
    AsyncSearchFilterTypeConfiguration:
      allOf:
      - "$ref": "#/components/schemas/BaseFilterInputType"
      - type: object
        required:
        - input_type
        - payload
        properties:
          input_type:
            const: async_search
            description: Async search input type identifier
          payload:
            type: object
            required:
            - filter_types
            - mode
            - url
            properties:
              filter_types:
                type: array
                items:
                  "$ref": "#/components/schemas/ArrayFilterTypes"
                description: Available filter types for array filters
              mode:
                type: string
                enum:
                - inline
                - popover
                description: Mode of the array filter
              url:
                type: string
                format: uri
                description: URL to fetch the async search options
    LocationSearchOptions:
      type: object
      required:
      - key
      - source
      properties:
        key:
          type: string
          description: Location search key
        source:
          "$ref": "#/components/schemas/LocationSources"
    NearMeLocationFilterValues:
      type: object
      required:
      - source
      - id
      - name
      properties:
        source:
          "$ref": "#/components/schemas/LocationSources"
        id:
          type: string
          description: Location identifier
        name:
          type: string
          description: Location name
    NearMeCommunityMemberProfileField:
      type: object
      required:
      - id
      - text
      properties:
        id:
          type: number
          description: Profile field identifier
        text:
          type: string
          description: Profile field text
    NearMeFilterTypeConfiguration:
      allOf:
      - "$ref": "#/components/schemas/BaseFilterInputType"
      - type: object
        required:
        - input_type
        - payload
        properties:
          input_type:
            type: string
            enum:
            - near_me
            description: Near me input type identifier
          payload:
            type: object
            required:
            - location_search_options
            - require_user_to_provide_more_precise_location
            - near_me_location_filter_values
            - community_member_profile_field
            properties:
              location_search_options:
                "$ref": "#/components/schemas/LocationSearchOptions"
              require_user_to_provide_more_precise_location:
                type: boolean
                description: Whether to require more precise location from user
              near_me_location_filter_values:
                nullable: true
                allOf:
                - "$ref": "#/components/schemas/NearMeLocationFilterValues"
                description: Near me location filter values
              community_member_profile_field:
                nullable: true
                allOf:
                - "$ref": "#/components/schemas/NearMeCommunityMemberProfileField"
                description: Community member profile field
    PresetFilterTypeConfiguration:
      allOf:
      - "$ref": "#/components/schemas/BaseFilterInputType"
      - type: object
        required:
        - input_type
        - payload
        properties:
          input_type:
            type: string
            enum:
            - preset
            description: Preset input type identifier
          payload:
            type: object
            required:
            - preset_params
            properties:
              preset_params:
                type: object
                additionalProperties: true
                description: Preset parameters (flexible object)
    LocationFilterTypeConfiguration:
      allOf:
      - "$ref": "#/components/schemas/BaseFilterInputType"
      - type: object
        required:
        - input_type
        - payload
        properties:
          input_type:
            type: string
            enum:
            - location
            description: Location input type identifier
          payload:
            type: object
            required:
            - location_search_options
            properties:
              location_search_options:
                "$ref": "#/components/schemas/LocationSearchOptions"
              mode:
                type: string
                enum:
                - inline
                - popover
                description: Render mode for the location filter. If inlined, the
                  location search options will be displayed inline. If popover, the
                  location search options will be displayed in a popover.
    SearchFilterTypeConfiguration:
      allOf:
      - "$ref": "#/components/schemas/BaseFilterInputType"
      - type: object
        required:
        - input_type
        - payload
        properties:
          input_type:
            type: string
            enum:
            - search
            description: Search input type identifier
          payload:
            type: object
            nullable: true
            description: No payload required for search filters
    location_result:
      type: object
      required:
      - source
      properties:
        name:
          type: string
          nullable: true
          description: Short place name. May equal full_address when Mapbox omits
            the short name.
          example: Bristol
        full_address:
          type: string
          nullable: true
          example: Bristol, England, United Kingdom
        feature_type:
          type: string
          nullable: true
          description: Mapbox place type (e.g. place, region, country). Needed to
            build a geo_location contact filter.
          example: place
        source:
          type: string
          description: Geocoder that produced this result.
          example: mapbox_v6
        source_id:
          type: string
          nullable: true
          description: 'Opaque Mapbox location id. To build a geo_location contact
            filter, map this result to { source, id: source_id, name, feature_type
            }.'
          example: dXJuOm1ieHBsYzpHMGhQ
    location_search_results:
      type: object
      properties:
        results:
          type: array
          items:
            "$ref": "#/components/schemas/location_result"
    basic_post:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        name:
          type: string
          nullable: true
        tiptap_body:
          type: object
          properties:
            body:
              type: object
              properties:
                type:
                  type: string
                content:
                  type: array
                  items:
                    type: object
            circle_ios_fallback_text:
              type: string
            attachments:
              type: array
              items: {}
            inline_attachments:
              type: array
              items: {}
            sgids_to_object_map:
              type: object
            format:
              type: string
            community_members:
              type: array
              items:
                "$ref": "#/components/schemas/shared_community_member"
            entities:
              type: array
              items: {}
            group_mentions:
              type: array
              items: {}
            polls:
              type: array
              items: {}
          nullable: true
        body:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            body:
              type: string
            record_type:
              type: string
            record_id:
              type: integer
            created_at:
              type: string
              format: date_time
            updated_at:
              type: string
              format: date_time
        slug:
          type: string
        url:
          type: string
        space_name:
          type: string
        space_slug:
          type: string
        space_id:
          type: integer
        user_id:
          type: integer
        user_email:
          type: string
        user_name:
          type: string
        comments_count:
          type: integer
        community_id:
          type: integer
        hide_meta_info:
          type: boolean
        user_avatar_url:
          type: string
          nullable: true
        published_at:
          type: string
          format: date_time
        created_at:
          type: string
          format: date_time
        updated_at:
          type: string
          format: date_time
        cover_image:
          type: string
          nullable: true
        cover_image_url:
          type: string
          nullable: true
        cardview_thumbnail:
          type: string
          nullable: true
        cardview_thumbnail_url:
          type: string
          nullable: true
        is_comments_enabled:
          type: boolean
        is_comments_closed:
          type: boolean
        is_liking_enabled:
          type: boolean
        flagged_for_approval_at:
          type: string
          format: date_time
          nullable: true
        unresolved_flagged_reports_count:
          type: integer
        custom_html:
          type: string
          nullable: true
        likes_count:
          type: integer
        topics:
          type: array
          items:
            type: integer
        member_posts_count:
          type: integer
        member_comments_count:
          type: integer
        member_likes_count:
          type: integer
    community:
      type: object
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date_time
        name:
          type: string
        locale:
          type: string
        slug:
          type: string
        allow_signups_to_public_community:
          type: boolean
        community_switcher_enabled:
          type: boolean
        custom_cta_for_share_links:
          type: boolean
        locked_post_cta_heading:
          type: string
          nullable: true
        locked_post_cta_body:
          type: string
          nullable: true
        locked_post_cta_button_text:
          type: string
          nullable: true
        locked_post_cta_button_url:
          type: string
          nullable: true
        custom_tos_enabled:
          type: boolean
        custom_tos:
          type: string
          nullable: true
        default_existing_member_space_id:
          type: integer
          nullable: true
        default_logged_out_space_id:
          type: integer
          nullable: true
        default_new_member_space_id:
          type: integer
          nullable: true
        default_search_sorting:
          type: string
        is_private:
          type: boolean
          nullable: true
        private_signup_link_label:
          type: string
          nullable: true
        private_signup_link_url:
          type: string
          nullable: true
        reply_to_email:
          type: string
          nullable: true
        white_label:
          type: boolean
        weekly_digest_enabled:
          type: boolean
        digest_subject:
          type: string
          nullable: true
        digest_intro:
          type: string
          nullable: true
        digests_hide_posts:
          type: boolean
          nullable: true
        digests_hide_comments:
          type: boolean
          nullable: true
        digests_hide_stats:
          type: boolean
          nullable: true
        digests_hide_members:
          type: boolean
          nullable: true
        prefs:
          type: object
          properties:
            has_posts:
              type: boolean
            has_spaces:
              type: boolean
            brand_color:
              type: object
              properties:
                light:
                  type: string
                dark:
                  type: string
            brand_text_color:
              type: object
              properties:
                light:
                  type: string
                dark:
                  type: string
            has_invited_member:
              type: boolean
        community_setting:
          type: object
          properties:
            id:
              type: integer
            created_at:
              type: string
              format: date_time
            updated_at:
              type: string
              format: date_time
            ios_app_enabled:
              type: boolean
            show_ios_app_banner:
              type: boolean
            deactivate_account_enabled:
              type: boolean
            allow_profile_search_indexing:
              type: boolean
            truncate_post_body_in_email_notifications:
              type: boolean
            hide_emails_on_member_profiles:
              type: boolean
            allow_members_to_go_live:
              type: boolean
            enforce_otp_for_signup:
              type: boolean
            community_activity_notifications_email_enabled:
              type: boolean
            community_activity_notifications_in_app_enabled:
              type: boolean
            desktop_app_community_visibility_enabled:
              type: boolean
            allow_moderator_csv_download:
              type: boolean
            default_space_ids:
              type: array
              items:
                type: integer
            default_logged_out_redirect_type:
              type: string
              nullable: true
            default_logged_out_redirect_id:
              type: integer
              nullable: true
    ai_summary:
      type: object
      properties:
        overview:
          type: string
          nullable: true
        content:
          type: string
    rich_text_body:
      type: object
      properties:
        body:
          type: object
          properties:
            type:
              type: string
            content:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        text:
                          type: string
                          nullable: true
                        type:
                          type: string
                        circle_ios_fallback_text:
                          type: string
                          nullable: true
                        attrs:
                          type: object
                          properties:
                            sgid:
                              type: string
                            href:
                              type: string
                              nullable: true
                            target:
                              type: string
                              nullable: true
                          required:
                          - sgid
                        marks:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                              attrs:
                                type: object
                                properties:
                                  href:
                                    type: string
                                  target:
                                    type: string
                          nullable: true
                      required:
                      - type
                required:
                - type
                - content
        circle_ios_fallback_text:
          type: string
        attachments:
          type: array
          items: {}
        inline_attachments:
          type: array
          items: {}
        sgids_to_object_map:
          type: object
        format:
          type: string
        community_members:
          type: array
          items: {}
        entities:
          type: array
          items: {}
