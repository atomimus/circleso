          type: string
      - name: community_member_id
        in: query
        required: false
        description: Filter by community member ID
        schema:
          type: integer
      - name: community_member_public_uid
        in: query
        required: false
        description: Filter by community member public UID
        schema:
          type: string
      - name: billing_info_business_name
        in: query
        required: false
        description: Filter by billing info business name (partial match)
        schema:
          type: string
      - name: paywall_price_type
        in: query
        required: false
        description: Comma-separated list of paywall price types (e.g. subscription,onetime,installments)
        schema:
          type: string
      - name: processor_id
        in: query
        required: false
        description: Filter by exact processor (charge) ID
        schema:
          type: string
      - name: subscription_processor_id
        in: query
        required: false
        description: Filter by exact subscription processor ID
        schema:
          type: string
      - name: invoice_processor_id
        in: query
        required: false
        description: Filter by exact invoice processor ID
        schema:
          type: string
      - name: currency
        in: query
        required: false
        description: Comma-separated list of currency codes
        schema:
          type: string
      - name: paywall_ids
        in: query
        required: false
        description: Comma-separated list of paywall IDs
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Comma-separated list of statuses (e.g. paid,refunded,partial_refunded)
        schema:
          type: string
      - name: platform
        in: query
        required: false
        description: Comma-separated list of platforms (web, app_store, play_store)
        schema:
          type: string
      - name: amount_gte
        in: query
        required: false
        description: Minimum charge amount (in currency subunits)
        schema:
          type: integer
      - name: amount_lte
        in: query
        required: false
        description: Maximum charge amount (in currency subunits)
        schema:
          type: integer
      - name: created_at_gte
        in: query
        required: false
        description: Only include charges created on/after this date (ISO8601)
