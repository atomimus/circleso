        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  enum:
                  - contact_search
                  - near_me
                  - online
                  - recently_joined
                  - location
                  - tags
                  - profile_field
                  - spaces
                  - space_groups
                  - global
                  description: Filter to control; profile_field requires profile_field_id
