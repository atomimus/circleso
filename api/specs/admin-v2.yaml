  "/api/admin/v2/profile_fields":
    post:
      summary: Create Profile Field
      tags:
      - Profile Fields
      description: |
        Creates a new custom profile field for the community.

        Every part of the field is stated explicitly: `pages_attributes` lists the pages the field
        appears on and whether it is visible on each, `choices_attributes` lists the options for a
        select or checkbox field in the order given by `sort_key`, and `number_options_attributes`
        configures a number field. Nothing is derived — what you send is what is stored.

        To hide a field everywhere, send every page with `visible: false`. To change an existing
        field use the update endpoint; to take one out of use without deleting it use archive.
      security:
      - token_auth: []
        host: []
      parameters: []
      responses:
        '201':
          description: Profile field created successfully
          content:
            application/json:
              examples:
                success:
                  value:
                    id: 1
                    label: Department
                    field_type: text
                    key: department
                    placeholder: e.g., Engineering
                    description: Your department
                    required: false
                    allow_null: true
                    platform_field: false
                    archived: false
                    created_at: '2025-10-27T14:00:00.000Z'
                    updated_at: '2025-10-27T14:00:00.000Z'
                    number_options:
                    choices: []
                    pages:
                    - id: 1
                      name: signup
                      position: 1
                      visible: true
                      created_at: '2025-10-27T14:00:00.000Z'
                      updated_at: '2025-10-27T14:00:00.000Z'
              schema:
                "$ref": "#/components/schemas/profile_field"
        '422':
          description: Invalid profile field params
          content:
            application/json:
              examples:
                unprocessable_content:
                  value:
                    success: false
                    message: Can't create profile field. There are some errors.
                    error_details: Key has already been taken
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: Unauthenticated
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                profile_field:
                  type: object
                  properties:
                    label:
                      type: string
                      minLength: 1
                      maxLength: 255
                      description: Field label shown to members
                      example: Department
                    field_type:
                      type: string
                      enum:
                      - text
                      - select
                      - checkbox
                      - textarea
                      - link
                      - number
                      description: Type of field to create
                    key:
                      type: string
                      minLength: 1
                      maxLength: 100
                      pattern: "^[a-z0-9_]+$"
                      description: Unique identifier for the field within the community.
                        Lowercase letters, numbers and underscores only
                    description:
                      type: string
                      description: Help text shown to members
                    placeholder:
                      type: string
                      description: Placeholder text. Only meaningful for text, textarea
                        and link fields
                    required:
                      type: boolean
                      description: Whether members must fill the field in. Defaults
                        to false
                    allow_null:
                      type: boolean
                      description: Whether the field may be left empty. Defaults to
                        false
                    pages_attributes:
                      type: array
                      description: The pages the field appears on. Send all four to
                        state visibility explicitly
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            enum:
                            - signup
                            - edit_profile
                            - profile_view
                            - community_view
                            description: Page the field appears on
                          visible:
                            type: boolean
                            description: Whether the field is visible on this page
                        required:
                        - name
                        - visible
                    choices_attributes:
                      type: array
                      maxItems: 50
                      description: Options for a select or checkbox field. Required
                        for those types, must be absent otherwise
                      items:
                        type: object
                        properties:
                          value:
                            type: string
                            description: Option label
                          sort_key:
                            type: integer
                            description: Position of the option, ascending
                        required:
                        - value
                    number_options_attributes:
                      type: object
                      description: Formatting for a number field. Required for that
                        type, must be absent otherwise
                      properties:
                        format:
                          type: string
                          enum:
                          - number
                          - percentage
                          - custom
                          - unformatted
                          description: How the number is formatted
                        decimal:
                          type: integer
                          minimum: 0
                          description: Number of decimal places
                        text:
                          type: string
                          description: Custom text shown alongside the number. Required
                            when format is custom
                        position:
                          type: string
                          enum:
                          - left
                          - right
                          description: Which side of the number the custom text sits
                            on
                      required:
                      - format
                  required:
                  - label
                  - field_type
                  - key
                  - pages_attributes
              required:
              - profile_field
        required: true
        description: Profile field attributes
    get:
      summary: Profile Fields List
      tags:
      - Profile Fields
      security:
      - token_auth: []
        host: []
      parameters:
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Number of records per page
        schema:
          type: integer
      - name: label
        in: query
        required: false
        description: Filter by label (case-insensitive partial match)
        schema:
          type: string
      - name: archived
        in: query
        required: false
        description: Set to 'true' to search archived profile fields, omit or set
          to 'false' for active fields
        schema:
          type: string
      responses:
        '200':
          description: Retrieves a list of profile fields for a community
          content:
            application/json:
              examples:
                success:
                  value:
                    page: 1
                    per_page: 10
                    has_next_page: false
                    count: 2
                    page_count: 1
                    records:
                    - id: 1
                      label: Department
                      field_type: text
                      key: department
                      placeholder: e.g., Engineering
                      description: Your department
                      required: false
                      allow_null: true
                      platform_field: false
                      archived: false
                      created_at: '2025-10-27T14:00:00.000Z'
                      updated_at: '2025-10-27T14:00:00.000Z'
                      number_options:
                      choices: []
                      pages:
                      - id: 1
                        name: signup
                        position: 1
                        visible: true
                        created_at: '2025-10-27T14:00:00.000Z'
                        updated_at: '2025-10-27T14:00:00.000Z'
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  per_page:
                    type: integer
                  has_next_page:
                    type: boolean
                  count:
                    type: integer
                  page_count:
                    type: integer
                  records:
                    type: array
                    items:
                      "$ref": "#/components/schemas/profile_field"
        '401':
          description: Unauthenticated
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
  "/api/admin/v2/profile_fields/{id}":
    delete:
      summary: Delete Profile Field
      tags:
      - Profile Fields
      description: |
        Permanently deletes an archived custom profile field.

        The field must be archived first — deleting an active field returns a 404 telling you to
        archive it. Archiving is reversible; this is not.

        Deletion cascades: the field's pages, choices and number options go with it, along with
        every member's stored value for the field. There is no undo and no confirmation step.
      security:
      - token_auth: []
        host: []
      parameters:
      - name: id
        in: path
        schema:
          type: integer
        required: true
        description: Archived profile field ID
      responses:
        '200':
          description: Profile field deleted
          content:
            application/json:
              examples:
                success:
                  value:
                    success: true
                    message: Profile field deleted successfully.
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '404':
          description: Profile field not found
          content:
            application/json:
              examples:
                not_found:
                  value:
                    success: false
                    message: Oops! Missing record. Please try again later.
                    error_details:
                      message: 'Missing record: profile fields/profile field'
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
    put:
      summary: Update Profile Field
      tags:
      - Profile Fields
      description: |
        Updates an existing custom profile field. Only the attributes sent are changed; anything
        omitted is left as it is.

        Nested records are addressed by `id`: send `pages_attributes` with a page id to change its
        visibility, and `choices_attributes` with a choice id to rename or reorder that option.
        Omit the id to add a new choice, or send `_destroy: true` to remove one — removing a choice
        also removes every member's selection of it.

        `field_type` cannot be changed once the field exists. To take a field out of use without
        deleting it, use the archive endpoint.
      security:
      - token_auth: []
        host: []
      parameters:
      - name: id
        in: path
        schema:
          type: integer
        required: true
        description: Profile field ID
      responses:
        '200':
          description: Profile field updated successfully
          content:
            application/json:
              examples:
                success:
                  value:
                    id: 1
                    label: Team
                    field_type: text
                    key: department
                    placeholder:
                    description:
                    required: false
                    allow_null: false
                    platform_field: false
                    archived: false
