  "/api/admin/v2/paywalls/{id}/archive":
    put:
      summary: Archives a paywall
      tags:
      - Paywalls
      description: |
        Archives a paywall (sets it inactive). Only an already-published (active) paywall
        can be archived -- a draft paywall must be published or deleted instead, and an
        already-archived paywall returns an error.

        Warning: archiving a paywall irreversibly discards every kept upsell offer where
        this paywall is either the host or the target, along with each discarded offer's
        prices and customization attachments. Unarchiving the paywall later does not
        restore these offers.
      security:
      - token_auth: []
        host: []
      parameters:
      - name: id
        in: path
        schema:
          type: integer
        required: true
        description: Paywall ID
      responses:
        '200':
          description: Paywall archived successfully, discarding kept upsell offers
            where the paywall is host or target
          content:
            application/json:
              examples:
                success:
                  value:
                    success: true
                    message: Paywall was archived.
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                required:
                - success
                - message
        '404':
          description: Paywall not found (nonexistent, already deleted, or belongs
            to another community)
          content:
            application/json:
              examples:
                paywall_not_found:
                  value:
                    success: false
                    message: Oops! Missing record. Please try again later.
                    error_details:
                      message: 'Missing record: paywall'
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: Unauthenticated
          content:
            application/json:
              examples:
                not_authorized:
                  value:
                    success: false
                    message: You cannot perform this action.
                    error_details: {}
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: Paywall cannot be archived (invalid current state)
          content:
            application/json:
              examples:
                already_archived:
                  value:
                    success: false
                    message: Paywall is already archived.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
  "/api/admin/v2/paywalls/{paywall_id}/member_access_syncs":
    post:
      summary: Syncs a legacy paywall's member access
      tags:
      - Paywalls
      description: |
        Schedules a legacy (non-access-group-enabled) paywall's member access to be
        recomputed and re-granted for every subscriber. This is genuinely asynchronous:
        the response returns a scheduled PaywallJob resource before the underlying worker
        runs, let alone before member access changes materialize -- do not poll this
        endpoint expecting an inline completed result. Access-group-enabled paywalls
        already propagate access changes on every edit and reject this action with a 422.

        A repeat call for the same paywall within the ~5-minute dedup window (or while
        the scheduled worker is still running) returns 201 with the same PaywallJob
        rather than creating a new one -- the id is not a signal that a fresh sync
        was scheduled.
      security:
      - token_auth: []
        host: []
      parameters:
      - name: paywall_id
        in: path
        schema:
          type: integer
        required: true
        description: Paywall ID
      responses:
        '201':
          description: Member access sync scheduled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/paywall_member_access_sync"
        '422':
          description: Paywall already propagates member access via access groups
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
        '404':
          description: Paywall not found (nonexistent or belongs to another community)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
