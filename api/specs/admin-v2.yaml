  "/api/admin/v2/community_member_subscriptions/{id}/billing_date":
    patch:
      summary: Change a billing date or extend a genuine trial; change_billing_date
        requires billing_date and extend_trial requires days_to_extend (the opposite
        field is ignored); ineligible selected operations return 401 before input
        validation
      tags:
      - Community Member Subscriptions
      operationId: change_billing_date_or_extend_trial_community_member_subscription
      description: Change the billing date or extend a genuine trial. Selected operation
        eligibility is checked before mobile and input validation. Unused fields are
        ignored. Dates are parsed as calendar dates; use YYYY-MM-DD as the canonical
        example.
      security:
      - token_auth: []
        host: []
      parameters:
      - name: id
        in: path
        schema:
          type: integer
        required: true
        description: Community Member Subscription ID
      responses:
        '200':
          description: Billing date updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/community_member_subscription"
        '422':
          description: Invalid supported input, missing trial anchor, mobile-platform
            rejection, or billing date service failure
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
        '404':
          description: Subscription is missing or belongs to another community
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                operation:
                  type: string
                  enum:
                  - change_billing_date
                  - extend_trial
                  description: Billing operation to perform.
                billing_date:
                  type: string
                  description: Required for change_billing_date; ignored for extend_trial.
                    Parsed as a calendar date. Use YYYY-MM-DD as the canonical example.
                days_to_extend:
                  type: integer
                  minimum: 1
                  description: Required for extend_trial; ignored for change_billing_date.
                    Must be a positive integer.
              required:
              - operation
