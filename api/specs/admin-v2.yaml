  "/api/admin/v2/community_leads":
    post:
      summary: Create a non-member contact (lead). To add a full community member
        instead, use create_community_member.
      tags:
      - Community Leads
      description: |
        Creates a non-member contact (also called a lead) in the community from an email address.

        A non-member contact appears in the community's audience and can be reached by email marketing,
        but has no login and no access to the community. To add someone as a full member with access,
        use the create_community_member endpoint instead.

        The email must not already belong to a member or to an existing non-member contact in this
        community - both cases return a 422.
      security:
      - token_auth: []
        host: []
      parameters: []
      responses:
        '201':
          description: Non-member contact created successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/community_lead"
        '422':
          description: Non-member contact could not be created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: Unauthenticated
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: jo@example.com
                  description: Email address of the contact. Must not already belong
                    to a member or an existing non-member contact in this community.
                name:
                  type: string
                  example: Jo Bloggs
                  description: Display name of the contact.
                member_tag_ids:
                  type: array
                  items:
                    type: integer
                  example:
                  - 1
                  description: IDs of existing member tags to apply to the new contact.
                    Use the member_tags endpoints to look these up.
              required:
              - email
        required: true
        description: Non-member contact attributes
  "/api/admin/v2/community_leads/{id}":
    delete:
      summary: Delete a non-member contact (lead). To delete a full community member
        instead, use destroy_community_member.
      tags:
      - Community Leads
      description: |
        Deletes a non-member contact (also called a lead) from the community's audience.

        This is a soft delete: the contact is removed from the audience and no longer appears in
        listings, but is retained and is restored automatically if the same contact is re-added.
        It only removes non-member contacts: pass the numeric id of a contact returned by the
        community_leads or contacts endpoints. An id that belongs to a full community member (or to
        a contact in another community) returns a 404 and deletes nothing - to remove a member with
        community access, use destroy_community_member instead.
      security:
      - token_auth: []
        host: []
      parameters:
      - name: id
        in: path
        required: true
        description: Numeric id of the non-member contact to delete
        schema:
          type: integer
      responses:
        '200':
          description: Non-member contact deleted successfully
          content:
            application/json:
              examples:
                success:
                  value:
                    message: Non-member contact deleted successfully.
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Non-member contact not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: Unauthenticated
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
