  "/api/admin/v2/tax_setting":
    get:
      summary: Get tax settings
      tags:
      - Tax Settings
      description: Returns the community's Stripe Tax settings, refreshed from a live
        Stripe read.
      security:
      - token_auth: []
        host: []
      responses:
        '200':
          description: Tax settings
          content:
            application/json:
              examples:
                tax_setting:
                  value:
                    processor_status: enabled
                    platform_status: disabled
                    default_tax_behavior: exclusive
              schema:
                "$ref": "#/components/schemas/tax_setting"
        '401':
          description: Unauthenticated
          content:
            application/json:
              examples:
                not_authorized:
                  value:
                    message: You cannot perform this action.
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
        '400':
          description: Live Stripe Tax resolve fails
          content:
            application/json:
              examples:
                resolve_failed:
                  value:
                    success: false
                    message: Unable to reach Stripe.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
    put:
      summary: Update tax settings
      tags:
      - Tax Settings
      description: Updates the community's Stripe Tax platform status and/or default
        tax behavior.
      security:
      - token_auth: []
        host: []
      parameters: []
      responses:
        '200':
          description: Stale disabled cache with live-enabled Stripe Tax succeeds
          content:
            application/json:
              examples:
                tax_setting_updated:
                  value:
                    processor_status: enabled
                    platform_status: enabled
                    default_tax_behavior: inclusive
                stale_disabled_cache_live_enabled:
                  value:
                    processor_status: enabled
                    platform_status: enabled
                    default_tax_behavior: inclusive
              schema:
                "$ref": "#/components/schemas/tax_setting"
        '422':
          description: Validation error (invalid platform_status, invalid default_tax_behavior,
            or processor disabled)
          content:
            application/json:
              examples:
                invalid_platform_status:
                  value:
                    success: false
                    message: 'Platform status must be one of: enabled, disabled.'
                    error_details: {}
                invalid_default_tax_behavior:
                  value:
                    success: false
                    message: 'Default tax behavior must be one of: exclusive, inclusive,
                      inferred_by_currency.'
                    error_details: {}
                processor_disabled:
                  value:
                    success: false
                    message: Stripe Tax is disabled for this community's payment processor.
                      Enable it in Stripe before updating tax settings.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: Unauthenticated
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tax_setting:
                  type: object
                  properties:
                    platform_status:
                      type: string
                      enum:
                      - enabled
                      - disabled
                      description: Whether Circle collects tax on the community's
                        payments. Tax is collected only when this is enabled and Stripe
                        Tax is also active on the connected Stripe account
                    default_tax_behavior:
                      type: string
                      enum:
                      - exclusive
                      - inclusive
                      - inferred_by_currency
                      description: 'Default tax behavior saved to the connected Stripe
                        account''s tax settings: inclusive (prices include tax), exclusive
                        (tax is added on top of prices) or inferred_by_currency'
