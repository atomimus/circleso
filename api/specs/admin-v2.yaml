                      description: Whether members must fill the field in
                    allow_null:
                      type: boolean
                      description: Whether the field may be left empty
                    pages_attributes:
                      type: array
                      description: Visibility changes, addressed by page id
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Id of a page belonging to this profile field
                          visible:
                            type: boolean
                            description: Whether the field is visible on this page
                        required:
                        - id
                        - visible
                    choices_attributes:
                      type: array
                      maxItems: 50
                      description: Option changes for a select or checkbox field.
                        Omit id to add an option, send _destroy to remove one
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Id of an existing choice. Omit to add a new
                              one
                          value:
                            type: string
                            description: Option label
                          sort_key:
                            type: integer
                            description: Position of the option, ascending
                          _destroy:
                            type: boolean
                            description: Set to true to delete this choice and every
                              member's selection of it
                    number_options_attributes:
                      type: object
                      description: Formatting changes for a number field
                      properties:
                        id:
                          type: integer
                          description: Id of the number options belonging to this
                            profile field
                        format:
                          type: string
                          enum:
                          - number
                          - percentage
                          - custom
                          - unformatted
                          description: How the number is formatted
                        decimal:
                          type: integer
                          minimum: 0
                          description: Number of decimal places
                        text:
                          type: string
                          description: Custom text shown alongside the number. Required
                            when format is custom
                        position:
                          type: string
                          enum:
                          - left
                          - right
                          description: Which side of the number the custom text sits
                            on
              required:
              - profile_field
        required: true
        description: Profile field attributes to change
