  "/api/admin/v2/settings/connect":
    get:
      summary: Get Connect settings
      tags:
      - Connect Settings
      description: |
        Returns the current community's Connect settings — the admin settings that control member-to-member interactions. No parameters; always reads the authenticated community's live settings.

        Three sections:
        - connect: enabled, recommendations, exclude_admins_from_recommendations, exclude_moderators_from_recommendations
        - member_directory: public, sort (alphabetical/oldest/latest), view (list/cards)
        - messaging: enabled, member_to_member_messaging_enabled, group_messaging_enabled, voice_messages_enabled, require_connection_before_messaging

        Use this to answer questions like "Is messaging enabled?", "Is the member directory public?", or "Are voice messages enabled?" — fetch live rather than answering from memory.
      security:
      - token_auth: []
        host: []
      responses:
        '200':
          description: Connect settings
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/connect_settings"
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
    patch:
      summary: Update Connect settings
      tags:
      - Connect Settings
      description: |
        Updates the current community's Connect settings — the admin settings that control member-to-member interactions. Every field is optional; only the fields you send are changed, the rest are left untouched (partial update).

        Params are grouped into three nested objects:
        - connect: enabled, recommendations (only effective when connect.enabled is true), exclude_admins_from_recommendations, exclude_moderators_from_recommendations
        - member_directory: public, sort (alphabetical/oldest/latest), view (list/cards)
        - messaging: enabled (master toggle), member_to_member_messaging_enabled, group_messaging_enabled, voice_messages_enabled, require_connection_before_messaging

        Use this to change settings — e.g. "Enable Connect", "Make the member directory public", "Sort the member directory alphabetically", or "Turn off group messaging". To read the current settings without changing them, use get_setting_connect instead.
      security:
      - token_auth: []
        host: []
      parameters: []
      responses:
        '200':
          description: Connect settings updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/connect_settings"
        '422':
          description: Validation error (invalid member_directory.sort or member_directory.view)
          content:
            application/json:
              examples:
                invalid_sort:
                  value:
                    success: false
                    message: 'Invalid sort value. Must be one of: alphabetical, oldest,
                      latest'
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: Unauthenticated
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                connect:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      description: Whether the Connect feature is enabled for the
                        community
                    recommendations:
                      type: boolean
                      description: Whether member-to-member connection recommendations
                        are enabled. Only effective when connect.enabled is true.
                    exclude_admins_from_recommendations:
                      type: boolean
                      description: Whether admins are excluded from connection recommendations
                    exclude_moderators_from_recommendations:
                      type: boolean
                      description: Whether moderators are excluded from connection
                        recommendations
                member_directory:
                  type: object
                  properties:
                    public:
                      type: boolean
                      description: Whether the member directory is publicly visible
                    sort:
                      type: string
                      enum:
                      - alphabetical
                      - oldest
                      - latest
                      description: Default sort order for the member directory
                    view:
                      type: string
                      enum:
                      - list
                      - cards
                      description: Default view layout for the member directory
                messaging:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      description: Whether messaging is enabled for the community
                        (master toggle)
                    member_to_member_messaging_enabled:
                      type: boolean
                      description: Whether members can direct message one another
                    group_messaging_enabled:
                      type: boolean
                      description: Whether members can create group chats
                    voice_messages_enabled:
                      type: boolean
                      description: Whether voice messages are enabled in chats
                    require_connection_before_messaging:
                      type: boolean
                      description: Whether members must be connected before they can
                        message each other
