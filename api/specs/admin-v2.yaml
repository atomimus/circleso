                "$ref": "#/components/schemas/chat_preferences"
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              examples:
                unprocessable_content:
                  value:
                    success: false
                    message: Something went wrong while updating chat preferences.
                    error_details:
                      message: Record invalid
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: Unauthenticated
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                messaging_enabled:
                  type: boolean
                  example: true
                  description: Enable or disable messaging for the community
                group_messaging_enabled:
                  type: boolean
                  example: true
                  description: Enable or disable group messaging for the community
                voice_messages_enabled:
                  type: boolean
                  example: true
                  description: Enable or disable voice messages for the community
                member_to_member_messaging_enabled:
                  type: boolean
                  example: true
                  description: Enable or disable member-to-member messaging for the
                    community
            examples:
              Update Community Chat Preferences:
                summary: Updates community chat preferences
                value:
                  messaging_enabled: true
                  group_messaging_enabled: true
                  voice_messages_enabled: true
                  member_to_member_messaging_enabled: true
  "/api/admin/v2/chat_room_message_imports":
    post:
      summary: Import Chat Room Message
      tags:
      - Chat Room Message Imports
      description: |
        Imports a historical message into a chat space on behalf of the specified user.
        The user is automatically added as a space member and chat room participant if not already present.
        The sent_at field is required and must be a past timestamp — this endpoint is intended exclusively
        for importing historical messages. Notifications are never sent for imported messages.
      security:
      - token_auth: []
        host: []
      parameters: []
      responses:
        '201':
          description: Chat room message imported successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/admin_v2_chat_room_message"
        '422':
          description: Invalid params
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: Unauthenticated
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - chat_room_uuid
              - user_email
              - rich_text_body
              - sent_at
              properties:
                chat_room_uuid:
                  type: string
                  description: UUID of the target chat room (from a chat space)
                  example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                user_email:
                  type: string
                  description: Email of the community member who is the message sender
                  example: member@example.com
                rich_text_body:
                  type: object
                  description: 'TipTap rich text body, wrapped as `{ body: <tiptap_doc>
                    }`'
                  example:
                    body:
                      type: doc
                      content:
                      - type: paragraph
                        content:
                        - type: text
                          text: Hello!
                sent_at:
                  type: string
                  format: date-time
                  description: Timestamp for the imported message. Required and must
                    not be in the future.
                  example: '2024-01-01T12:00:00Z'
                parent_message_id:
                  type: integer
                  nullable: true
                  description: ID of the parent message when creating a thread reply
                  example:
        required: true
        description: Chat room message import params
