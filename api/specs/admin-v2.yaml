  "/api/admin/v2/workflows/{id}/activate":
    put:
      summary: Activate an automation (dynamic) workflow so it starts running automatically
      tags:
      - Workflows
      security:
      - token_auth: []
        host: []
      description: |
        Activates an automation (dynamic) workflow, setting its status to active so it starts
        running automatically. Only automation workflows can be activated: run a bulk action
        workflow immediately with run_workflow_now, and start a scheduled workflow from the
        workflow editor. Activation is immediate and enforces plan limits and eligibility
        (a valid trigger and at least one action); it is not gated behind a confirmation step.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID of the workflow to activate
      responses:
        '200':
          description: Workflow activated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/workflow"
        '422':
          description: Workflow could not be activated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: Unauthenticated
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    success: false
                    message: The API token is invalid.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: Community is not eligible for admin API v2 access
          content:
            application/json:
              examples:
                forbidden:
                  value:
                    success: false
                    message: The community is not eligible for admin API v2 access.
                    error_details: {}
              schema:
                "$ref": "#/components/schemas/error"
  "/api/admin/v2/workflows/{id}/deactivate":
    put:
      summary: Deactivate an automation (dynamic) workflow so it stops running automatically
      tags:
      - Workflows
      security:
      - token_auth: []
        host: []
      description: |
        Deactivates an active automation (dynamic) workflow, setting its status to inactive so it
        stops running automatically. Only automation workflows can be deactivated — bulk action and
        scheduled workflows cannot. The workflow must currently be active. Deactivation is immediate
        and is not gated behind a confirmation step.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID of the workflow to deactivate
      responses:
        '200':
          description: Workflow deactivated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/workflow"
        '422':
          description: Workflow could not be deactivated
